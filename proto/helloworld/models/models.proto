syntax = "proto3";


option go_package = "github.com/fluffy-bunny/fluffycore/proto/helloworld/models";
option java_multiple_files = true;
option java_package = "io.grpc.examples.helloworld.models";
option java_outer_classname = "HelloWorldProto";

package models;

 


// The request message containing the user's name.
message HelloRequest {
  string org_id = 1;
  string name = 2;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}

message HelloReply2 {
  string message = 1;

}

// SetSecret stores value under (org_id, key). Callable via a normal JWT
// bearer token or via mutual TLS -- see helloworld.proto's Greeter.SetSecret
// and example/internal/auth's entrypoint config for the OR-based requirement.
message SetSecretRequest {
  string org_id = 1;
  string key = 2;
  string value = 3;
}
message SetSecretResponse {
  bool success = 1;
}

// GetSecret retrieves a previously-set value for (org_id, key).
message GetSecretRequest {
  string org_id = 1;
  string key = 2;
}
message GetSecretResponse {
  string value = 1;
}